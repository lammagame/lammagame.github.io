<style>
/* Layout: TV-style 16:9 stage. Board = teams on both sides, board in the middle.
   Question = big stage (media + question) with a side rail for timer, answer and judging. */
:root{
  --night:#0E0C0B; --surface:#1A1715; --surface-raised:#2E2824; --hairline:#3A332E;
  --ink:#FFFFFF; --ink-muted:#CDC4BB;
  --orange:#FF6A13; --orange-text:#FF7A2E; --on-orange:#120F0D;
  --red:#E5232D; --red-text:#FF5A61; --on-red:#FFFFFF; --correct:#2BB673;
  --font-display:"Cairo","Segoe UI",Tahoma,system-ui,sans-serif;
  --font-logo:"Lalezar","Cairo",system-ui,sans-serif;
  --font-sans:"Cairo","Segoe UI",Tahoma,system-ui,sans-serif;
  --r-sm:8px; --r-md:14px; --r-lg:24px;
  --gap:clamp(8px,1.4vmin,16px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* بالعرض: الصفحة مثبّتة على الشاشة، حتى سفاري بالآيفون ما يزحلقها ويطلع فراغ أسود جوه */
@media (orientation:landscape){html,body{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none}body{height:auto}}
body{background:var(--night);color:var(--ink);font-family:var(--font-sans);font-size:16px;line-height:1.6;margin:0;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
h1,h2,h3,p{margin:0}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.muted{color:var(--ink-muted)}
.app{height:100%;display:flex;flex-direction:column;gap:var(--gap);padding-block:clamp(8px,2vmin,20px)}
.scroll{overflow-y:auto}

/* buttons */
.btn{font-size:clamp(15px,2.2vmin,22px);line-height:1.3;font-weight:700;border-radius:var(--r-md);padding:.7em 1.4em;min-height:48px;border:2px solid transparent;}
.btn-p{background:var(--orange);color:var(--on-orange)}
.btn-s{background:var(--surface-raised);color:var(--ink)}
.btn-g{background:transparent;color:var(--ink);border-color:var(--hairline)}
.btn-d{background:var(--red);color:var(--on-red)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-wide{width:100%}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>.btn{flex:1 1 160px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none}
.logo{font-family:var(--font-display);font-size:clamp(26px,4.5vmin,44px);line-height:1}
.logo span,.hero h1 span{color:var(--orange)}
.tools{display:flex;gap:6px}
.link{background:var(--surface);border:none;color:var(--ink-muted);font-size:clamp(14px,2.2vmin,18px);font-weight:700;padding:8px 14px;border-radius:999px}
.link:hover{color:var(--ink)}
.center-note{font-size:clamp(15px,2.6vmin,26px);font-weight:600;color:var(--ink-muted);text-align:center}
.center-note b{color:var(--ink)}

/* ---------- setup screens ---------- */
.setup{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,4vw,48px);align-items:center;max-width:1200px;width:100%;margin:0 auto}
.hero{display:grid;gap:12px}
.hero h1{font-family:var(--font-display);font-weight:900;font-size:clamp(64px,16vmin,160px);line-height:1}
.hero p{color:var(--ink-muted);font-size:clamp(15px,2.4vmin,22px);max-width:36ch}
.rules{display:grid;gap:6px;color:var(--ink-muted);font-size:clamp(13px,1.9vmin,17px);line-height:1.5;padding-inline-start:20px;margin:8px 0 0}
.card{background:var(--surface);border-radius:var(--r-lg);padding:clamp(16px,3vmin,28px);display:grid;gap:16px}
.field{display:grid;gap:6px}
.field>label,.field>.lbl{font-size:14px;line-height:20px;font-weight:600;color:var(--ink-muted);display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:999px;flex:none;display:inline-block}
.dot.a{background:var(--orange)} .dot.b{background:var(--red)}
input[type=text]{font:inherit;font-size:18px;background:var(--surface-raised);color:var(--ink);border:2px solid transparent;border-radius:var(--r-sm);padding:10px 12px;width:100%}
input[type=text]:focus{border-color:var(--orange);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:var(--surface-raised);color:var(--ink);border:2px solid transparent;border-radius:var(--r-sm);padding:6px 12px;font-size:14px;font-weight:600;line-height:20px}
.seg button[aria-pressed=true]{background:var(--orange);color:var(--on-orange)}
@media (orientation:portrait){
  .setup{grid-template-columns:1fr;align-items:start}
  body{overflow:auto}
  /* بالطول: الاسم والشرح القصير، بعدها الفورم مباشرة، والقواعد جوّه */
  .setup .hero{display:contents}
  .setup .hero h1{order:1}.setup .hero>p:not(.soonapp){order:2}.setup #f{order:3}.setup .rules{order:4}.setup .legal{order:5}.setup .soonapp{order:6;justify-self:start}
}
/* أهداف لمس مريحة (40px على الأقل) */
.link{min-height:40px;display:inline-flex;align-items:center;justify-content:center}
.sorts button{min-height:36px}
.ptbtn{min-height:36px;min-width:52px}
.qc-del{min-height:36px;padding:6px 10px}
@media (max-height:520px) and (orientation:landscape){.link{min-height:36px;padding:6px 12px}}

/* categories */
.cats{flex:1;min-height:0;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:var(--gap);max-width:1200px;width:100%;margin:0 auto}
.cats h2{font-family:var(--font-display);font-weight:900;font-size:clamp(30px,6vmin,56px);line-height:1.1}
.count{font-size:clamp(14px,2vmin,18px);color:var(--ink-muted)}
.count b{color:var(--orange-text);font-family:var(--font-display);font-size:1.4em;font-weight:900}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;align-content:start;overflow-y:auto;padding:2px}
.chip{display:flex;align-items:center;gap:10px;font-size:clamp(15px,2.2vmin,20px);font-weight:600;padding:clamp(10px,2vmin,18px) 16px;border-radius:var(--r-md);background:var(--surface);color:var(--ink);border:2px solid var(--hairline);text-align:start}
.chip .n{font-family:var(--font-display);font-size:1.3em;width:1.2em;text-align:center;line-height:1}
.chip[aria-pressed=true]{background:var(--orange);color:var(--on-orange);border-color:var(--orange)}
.chip:disabled{opacity:.4;cursor:not-allowed}

/* ---------- team chips in the top bar ---------- */
.bar{height:clamp(40px,10vh,64px)}
.teams{display:flex;gap:clamp(6px,1.2vw,12px);flex:1;justify-content:center;min-width:0}
.tchip{display:flex;align-items:center;gap:clamp(6px,1vw,12px);background:var(--surface);border:2px solid transparent;border-radius:999px;padding:clamp(2px,.6vh,6px) clamp(10px,1.4vw,18px);min-width:0;max-width:34vw;transition:border-color .2s}
.tchip.on.a{border-color:var(--orange)} .tchip.on.b{border-color:var(--red)}
.tchip .nm{font-weight:800;font-size:clamp(14px,3.2vh,22px);color:var(--ink-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tchip.on .nm{color:var(--ink)}
.tchip .pts{font-family:var(--font-display);font-size:clamp(18px,5vh,34px);line-height:1;font-variant-numeric:tabular-nums}
.tchip .turn{border-radius:999px;padding:0 10px;font-size:clamp(12px,2.6vh,16px);font-weight:700;line-height:1.7;display:none;white-space:nowrap}
.tchip.on .turn{display:inline-block}
.tchip.a .turn{background:var(--orange);color:var(--on-orange)}
.tchip.b .turn{background:var(--red);color:var(--on-red)}
.bump{animation:bump .6s ease}
@keyframes bump{40%{transform:scale(1.25)}}

/* ---------- board: full width ---------- */
.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(5px,1vw,14px)}
.col{display:grid;grid-template-rows:auto repeat(6,1fr);gap:clamp(4px,1vh,10px);min-height:0;min-width:0}
.head{background:var(--surface);border-radius:var(--r-md);padding:clamp(4px,1.2vh,12px) 4px;text-align:center;font-weight:800;font-size:clamp(15px,5vh,36px);line-height:1.2;display:grid;place-items:center;overflow:hidden;height:clamp(28px,9vh,64px)}
.tile{border-radius:var(--r-md);border:2px solid transparent;display:grid;place-items:center;font-family:var(--font-display);font-size:clamp(18px,5.6vh,46px);line-height:1;font-variant-numeric:tabular-nums;transition:transform .12s;min-height:0;padding:0}
.tile:not(:disabled):hover{transform:scale(1.04)}
.t200{background:var(--surface-raised);color:var(--ink)}
.t400{background:var(--orange);color:var(--on-orange)}
.t600{background:var(--red);color:var(--on-red)}
.tile.used{background:transparent;border:2px dashed var(--hairline);color:var(--ink-muted);font-family:var(--font-sans);font-size:clamp(14px,3vh,20px);cursor:default}
.marks{display:flex;gap:4px}

/* ---------- question stage ---------- */
.qstage{flex:1;min-height:0;display:grid;grid-template-columns:1fr clamp(200px,26vw,360px);gap:var(--gap)}
.qmain{background:var(--surface);border-radius:var(--r-lg);padding:clamp(10px,3vh,32px) clamp(12px,2vw,32px);display:flex;flex-direction:column;gap:clamp(6px,2vh,20px);min-height:0;min-width:0;position:relative}
.qmeta{position:absolute;top:clamp(8px,2.4vh,24px);inset-inline:clamp(10px,1.6vw,24px);display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none}
.qcat{font-weight:800;font-size:clamp(14px,3.4vh,24px);color:var(--ink-muted)}
.pill{border-radius:999px;padding:.05em .7em;font-family:var(--font-display);font-size:clamp(16px,5vh,38px);line-height:1.35}
.media{flex:1;min-height:0;background:var(--night);border-radius:var(--r-md);display:grid;place-items:center;overflow:hidden;padding:clamp(6px,2vh,20px);margin-top:clamp(28px,8vh,64px)}
.media svg{max-width:100%;max-height:100%;width:auto;height:100%;display:block;border-radius:var(--r-sm)}
.media img,.media video{width:100%;height:100%;object-fit:contain;display:block;border-radius:var(--r-sm);min-height:0}
.qtext{font-weight:800;text-wrap:balance;text-align:center;flex:none;font-size:clamp(16px,5.4vh,46px);line-height:1.4;max-height:30%;overflow:hidden;min-height:0}
.qtext.solo{flex:1 1 0;max-height:none;display:grid;place-items:center;font-size:clamp(22px,10vh,88px);line-height:1.35;margin-top:clamp(24px,7vh,60px);overflow:hidden}

.rail{background:var(--surface);border-radius:var(--r-lg);padding:clamp(8px,2.4vh,22px);display:flex;flex-direction:column;justify-content:center;gap:clamp(6px,2vh,16px);min-height:0;overflow:hidden}
.phase{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:clamp(14px,3.6vh,24px);text-align:center;flex:none}
.ring{position:relative;flex:1 1 auto;min-height:0;max-height:44vh;aspect-ratio:1;max-width:100%;margin:0 auto}
.ring svg{transform:rotate(-90deg);display:block;width:100%;height:100%}
.track{fill:none;stroke:var(--surface-raised);stroke-width:10}
.prog{fill:none;stroke:var(--orange);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s}
.ring.b .prog,.ring.late .prog{stroke:var(--red)}
.num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:clamp(28px,13vh,110px);line-height:1;font-variant-numeric:tabular-nums}
.ring.late .num{color:var(--red-text)}
.ring.late{animation:shake .5s ease infinite}
@keyframes shake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.rail .btn{flex:none;min-height:clamp(40px,11vh,56px);padding:.3em 1em;font-size:clamp(14px,3.4vh,22px);font-weight:800}
.answer{background:var(--surface-raised);border-radius:var(--r-md);padding:clamp(6px,2vh,18px);display:grid;gap:0;text-align:center;flex:none}
.answer .lbl{font-size:clamp(13px,2.8vh,17px);font-weight:700;color:var(--ink-muted)}
.answer .val{font-size:clamp(17px,6vh,42px);line-height:1.25;font-weight:700}
.jl{font-size:clamp(13px,2.8vh,17px);font-weight:700;color:var(--ink-muted);text-align:center;flex:none}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:clamp(6px,1vw,10px);flex:none}
.jbtn{border-radius:var(--r-md);padding:4px 6px;min-height:clamp(44px,12vh,64px);border:2px solid var(--hairline);background:transparent;color:var(--ink);font-weight:800;font-size:clamp(14px,3.2vh,20px);display:grid;place-items:center;gap:0;line-height:1.25;min-width:0}
.jbtn span{max-width:100%;line-height:1.2}
.jbtn small{font-weight:600;font-size:.82em;color:var(--ink-muted)}
.jbtn[aria-pressed=true].a{background:var(--orange);color:var(--on-orange);border-color:var(--orange)}
.jbtn[aria-pressed=true].b{background:var(--red);color:var(--on-red);border-color:var(--red)}
.jbtn[aria-pressed=true] small{color:inherit;opacity:.85}

/* timer controls */
.trow{--tc:clamp(64px,7vw,96px);--tg:clamp(6px,1vw,12px);flex:1 1 auto;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center;gap:var(--tg)}
.trow .ring{flex:none;margin:0;max-height:none;width:26vh;width:min(100cqh,calc(100cqw - var(--tc) - var(--tg)));height:auto;aspect-ratio:1}
.tctl{display:grid;grid-auto-rows:1fr;gap:clamp(4px,1vh,8px);width:var(--tc);flex:none}
.tbtn{background:transparent;color:var(--ink);border:2px solid var(--hairline);border-radius:var(--r-sm);padding:2px 6px;min-height:clamp(40px,9vh,52px);font-weight:800;font-size:clamp(12px,2.8vh,17px);line-height:1.2}
.tbtn:hover{border-color:var(--ink-muted)}
.ring{cursor:pointer}
.ring.is-paused{opacity:.55;animation:none}
.ring .paused{position:absolute;inset-inline:0;bottom:22%;text-align:center;font-weight:800;font-size:clamp(11px,2.6vh,16px);color:var(--ink)}

/* lifelines */
.lifes{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(4px,.8vw,8px);flex:none}
.life{background:var(--surface-raised);color:var(--ink);border:2px solid transparent;border-radius:var(--r-sm);padding:4px 2px;min-height:clamp(38px,11vh,58px);font-weight:800;font-size:clamp(12px,2.8vh,17px);line-height:1.2;display:grid;place-items:center;gap:0}
.life b{font-family:var(--font-display);font-weight:900;font-size:1.5em;line-height:1;color:var(--orange-text)}
.life:disabled{opacity:.35;cursor:not-allowed}
.life:disabled b{color:var(--ink-muted)}
.life.on{border-color:var(--orange);opacity:1}
.hints{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;flex:none}
.hintchip{display:inline-flex;align-items:center;gap:8px;background:var(--night);border:2px solid var(--hairline);border-radius:999px;padding:2px 14px;font-weight:600;font-size:clamp(12px,3vh,20px)}
.hintchip b{font-family:var(--font-display);font-weight:900;font-size:1.5em;line-height:1.2;color:var(--orange-text)}
.hintchip.b b{color:var(--red-text)}
.pips{display:inline-flex;gap:3px}
.pip{width:7px;height:7px;border-radius:999px;background:var(--ink-muted)}
.pip.off{background:var(--hairline)}
.tag2{border-radius:999px;padding:0 8px;font-size:.75em;background:var(--surface-raised);color:var(--ink)}

/* reveal: answer only */
.reveal{flex:1;min-height:0;display:grid;grid-template-columns:clamp(84px,13vw,180px) 1fr clamp(84px,13vw,180px);gap:var(--gap)}
.side{overflow:hidden;border-radius:var(--r-lg);border:2px solid var(--hairline);background:var(--surface);color:var(--ink);font-weight:800;font-size:clamp(14px,3.6vh,26px);line-height:1.25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1.4vh,12px);padding:8px;text-align:center}
.side .arrow{font-family:var(--font-display);font-weight:900;font-size:clamp(28px,10vh,72px);line-height:1}
.side.next{background:var(--orange);color:var(--on-orange);border-color:var(--orange)}
.side.next small{font-weight:700;font-size:.72em;opacity:.85}
.side:disabled{background:var(--surface);color:var(--ink-muted);border-color:var(--hairline);cursor:not-allowed}
.ansbox{background:var(--surface);border-radius:var(--r-lg);padding:clamp(10px,3vh,32px) clamp(12px,2vw,32px);display:flex;flex-direction:column;gap:clamp(6px,2vh,20px);min-height:0;min-width:0;position:relative}
.ans-main{flex:1 1 0;min-height:0;display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:clamp(24px,7vh,60px);gap:2px;overflow:hidden}
.ans-lbl{font-weight:800;font-size:clamp(13px,3.2vh,22px);color:var(--ink-muted)}
.ans-val{flex:1 1 0;min-height:0;width:100%;display:grid;place-items:center;overflow:hidden;font-weight:900;font-size:clamp(20px,12vh,110px);line-height:1.2;text-wrap:balance;color:var(--ink)}
.who{display:grid;gap:clamp(4px,1.4vh,12px);flex:none}
.who-q{text-align:center;font-weight:800;font-size:clamp(14px,3.4vh,24px);color:var(--ink-muted)}
.who-row{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(6px,1vw,12px)}
.wbtn{overflow:hidden;border-radius:var(--r-md);border:2px solid var(--hairline);background:transparent;color:var(--ink);font-weight:800;font-size:clamp(14px,3.6vh,24px);line-height:1.2;min-height:clamp(44px,13vh,80px);padding:4px 8px;display:grid;place-items:center;align-content:center;gap:2px;min-width:0}
.wbtn small{font-weight:700;font-size:.62em;opacity:.85}
.wbtn.a{border-color:var(--orange)} .wbtn.b{border-color:var(--red)}
.wbtn[aria-pressed=true].a{background:var(--orange);color:var(--on-orange)}
.wbtn[aria-pressed=true].b{background:var(--red);color:var(--on-red)}
.wbtn[aria-pressed=true].none{background:var(--ink);color:var(--night);border-color:var(--ink)}
@media (orientation:portrait){.reveal{grid-template-columns:1fr 1fr;grid-template-rows:1fr auto}.reveal .ansbox{grid-column:1/-1;grid-row:1;min-height:55vh}.side{grid-row:2;min-height:72px}}

/* splash */
.splash{position:fixed;inset:0;z-index:50;background:var(--night);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2.4vh,24px);padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));cursor:pointer;transition:opacity .5s ease,transform .5s ease;overflow:hidden}
.splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
.sp-board{display:grid;grid-template-columns:repeat(6,clamp(22px,6vh,56px));gap:clamp(4px,1vh,10px)}
.sp-board i{display:block;aspect-ratio:1.5;border-radius:clamp(5px,1.2vh,12px);opacity:0;transform:translateY(-40px) scale(.6);animation:drop .5s cubic-bezier(.3,1.6,.5,1) forwards}
.sp-board i:nth-child(1){animation-delay:.10s}.sp-board i:nth-child(2){animation-delay:.18s}.sp-board i:nth-child(3){animation-delay:.26s}
.sp-board i:nth-child(4){animation-delay:.34s}.sp-board i:nth-child(5){animation-delay:.42s}.sp-board i:nth-child(6){animation-delay:.50s}
.sp-board .t2{background:var(--surface-raised)}.sp-board .t4{background:var(--orange)}.sp-board .t6{background:var(--red)}
@keyframes drop{to{opacity:1;transform:none}}
.sp-logo{font-family:var(--font-logo);font-weight:400;font-size:clamp(56px,22vh,200px);line-height:1;margin:0;padding-top:.28em;opacity:0;transform:scale(.4);animation:pop .7s cubic-bezier(.3,1.5,.5,1) .75s forwards}
.sp-logo span{color:var(--orange)}
@keyframes pop{60%{opacity:1;transform:scale(1.08)}to{opacity:1;transform:none}}
.sp-lines{display:grid;justify-items:center;gap:clamp(2px,.8vh,8px);text-align:center}
.sp-lines p{margin:0;font-weight:800;font-size:clamp(16px,5.2vh,40px);line-height:1.3;opacity:0;transform:translateY(14px);animation:rise .55s ease forwards}
.sp-lines p:nth-child(1){animation-delay:1.7s}.sp-lines p:nth-child(2){animation-delay:2.4s}.sp-lines p:nth-child(3){animation-delay:3.1s}
.sp-lines b{color:var(--orange-text);font-weight:900}
@keyframes rise{to{opacity:1;transform:none}}
.sp-skip{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:clamp(11px,2.4vh,14px);font-weight:700;color:var(--ink-muted);opacity:0;animation:rise .4s ease 1.2s forwards}
@media (prefers-reduced-motion:reduce){.sp-board i,.sp-logo,.sp-lines p,.sp-skip{animation:none!important;opacity:1;transform:none}}

/* ads + premium */
.adbar{flex:none;display:flex;align-items:center;gap:10px;background:repeating-linear-gradient(45deg,var(--surface),var(--surface) 10px,var(--surface-raised) 10px,var(--surface-raised) 20px);border:2px dashed var(--hairline);border-radius:var(--r-sm);min-height:clamp(36px,8vh,56px);padding:4px 12px;font-size:clamp(11px,2.4vh,14px);font-weight:700;color:var(--ink-muted);min-width:0}
.adbar>span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adtag{background:var(--ink);color:var(--night);border-radius:4px;padding:0 6px;font-size:11px;font-weight:800;flex:none}
.adx{background:none;border:none;color:var(--orange-text);font-weight:800;font-size:inherit;flex:none;padding:4px}
.adfull{position:fixed;inset:0;z-index:45;background:rgb(0 0 0 / .85);display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.adcard{width:min(640px,100%);max-height:100%;background:var(--surface);border-radius:var(--r-lg);padding:clamp(12px,3vh,24px);display:flex;flex-direction:column;gap:clamp(8px,2vh,16px);overflow:auto}
.adcard .adtag{align-self:flex-start}
.adbox{flex:1;min-height:clamp(80px,30vh,260px);border:2px dashed var(--hairline);border-radius:var(--r-md);display:grid;place-content:center;text-align:center;gap:6px;padding:12px;background:repeating-linear-gradient(45deg,var(--night),var(--night) 12px,var(--surface) 12px,var(--surface) 24px)}
.adbox p{font-weight:900;font-size:clamp(16px,4.4vh,28px)}
.adbox small{color:var(--ink-muted);font-weight:700;font-size:clamp(11px,2.4vh,14px);max-width:44ch}
.prem-link{color:var(--orange-text)}
.premsheet{z-index:46}
.prem{max-width:640px!important;max-height:calc(100vh - 32px);overflow:auto;gap:clamp(8px,2vh,16px)!important}
.prem-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.prem-head h3{font-family:var(--font-logo);font-weight:400;font-size:clamp(24px,6vh,40px);line-height:1.1}
.prem-head h3 span{color:var(--orange)}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.plan{border:2px solid var(--hairline);border-radius:var(--r-md);padding:clamp(10px,2vh,16px);display:grid;gap:4px;align-content:start}
.plan.best{border-color:var(--orange)}
.pname{font-weight:800;color:var(--ink-muted)}
.price{font-weight:900;font-size:clamp(22px,5vh,34px);line-height:1.2}

/* يصغّر النص حتى يدخل في مساحته بدون ما يطلع على غيره */
function fitText(el,maxPx,minPx){
  if(!el||!el.clientHeight)return;
  /* نقيس النص الداخلي نفسه: لازم يدخل كاملاً داخل المربع بالطول والعرض */
  const inner=el.querySelector(".fitin");
  const over=()=>inner?(inner.offsetHeight>el.clientHeight-2||inner.scrollWidth>el.clientWidth+1):(el.scrollHeight>el.clientHeight+2||el.scrollWidth>el.clientWidth+1);
  let lo=Math.floor(minPx),hi=Math.max(lo,Math.floor(maxPx));el.style.fontSize=hi+"px";
  if(!over())return;
  while(hi-lo>1){const mid=Math.floor((lo+hi)/2);el.style.fontSize=mid+"px";over()?hi=mid:lo=mid}
  el.style.fontSize=lo+"px";
}
function fitAll(){
  const H=innerHeight;
  app.querySelectorAll(".ans-val").forEach(el=>fitText(el,Math.min(H*.2,130),14));
  app.querySelectorAll(".qtext.solo").forEach(el=>fitText(el,Math.min(H*.12,96),14));
  app.querySelectorAll(".qtext:not(.solo)").forEach(el=>fitText(el,Math.min(H*.06,48),12));
  app.querySelectorAll(".head").forEach(el=>fitText(el,Math.min(H*.034,24),10));
  app.querySelectorAll(".side").forEach(el=>fitText(el,Math.min(H*.04,26),11));
}

/* إحصائيات مجهولة: نعرف أي الفقرات تنلعب أكثر حتى نزيد أسئلتها. فقرات الجمهور تنحسب «custom» بدون اسمها */
function trackGame(){
  try{const C=CLOUD();if(C&&C.stat)C.stat(S.cats.map(id=>{const c=findCat(id);return !c?"?":c.custom?(String(id).startsWith("p_")||c.pub?"crowd":"custom"):id}))}catch(e){}
  if(!NATIVE||!window.LammaNative.track)return;
  window.LammaNative.track("game_start",{cats:S.cats.length});
  S.cats.forEach(id=>{const c=findCat(id);window.LammaNative.track("category_played",c&&!c.custom?{category_id:id,category_name:c.name}:{category_id:"custom"})})}
const ARAB=c=>c.id.startsWith("c_")||c.id==="iraq";
const FB=c=>c.id.startsWith("fb_");
function Cats(){
  const n=S.cats.length,tab=S.catTab==="crowd"?"crowd":"game";
  const chip=c=>{const i=S.cats.indexOf(c.id),on=i>-1;
    return `<button class="chip" data-id="${c.id}" aria-pressed="${on}" ${!on&&n>=6?"disabled":""}><span class="n">${on?i+1:""}</span><span>${esc(c.name)}</span></button>`};
  const mine=c=>`<div class="mychip">${chip(c)}<button class="edit" data-edit="${c.id}" type="button" aria-label="تعديل ${esc(c.name)}" title="تعديل">✎</button>${CLOUD()?`<button class="edit pubbtn ${c.pubId?"on":""}" data-pub="${c.id}" type="button" title="${c.pubId?"منشورة للكل":"انشرها للكل"}" aria-label="${c.pubId?"منشورة للكل":"انشرها للكل"}">${c.pubId?"✓":"⇪"}</button>`:""}</div>`;
  if(tab==="crowd"&&CLOUD()&&!PUBLIST&&!PUBERR)setTimeout(()=>loadPub(),0);
  app.innerHTML=`${topBar("",`<button class="link" id="back" type="button">رجوع</button>`,true)}
  <div class="cats">
    <div class="cats-head"><h2>اختاروا 6 فقرات</h2><p class="count">اخترتم <b>${n}</b> من 6</p></div>
    <div class="tabs" role="tablist" aria-label="نوع الفقرات">
      <button class="tab" role="tab" data-tab="game" aria-selected="${tab==="game"}" type="button">فقرات اللعبة <small>${BANK.length}</small></button>
      <button class="tab" role="tab" data-tab="crowd" aria-selected="${tab==="crowd"}" type="button">فقرات الجمهور <small>${CUSTOM.length+(PUBLIST?visiblePub().length:0)}</small></button>
    </div>
    <div class="chips-wrap" role="tabpanel">
      ${tab==="crowd"
        ?`<p class="sec mine-sec">فقراتي <small>تنحفظ على جهازكم، وتگدرون تنشرونها للكل</small></p>
      <div class="chips">${CUSTOM.map(mine).join("")}<button class="chip addchip" id="newcat" type="button"><span class="n">+</span><span>فقرة جديدة</span></button><label class="chip addchip" for="impf"><span class="n">⇩</span><span>استيراد ملف</span></label><input type="file" id="impf" accept=".zip,.txt,application/zip,text/plain" hidden></div>
      <div class="pubhead"><p class="sec">من الجمهور <small>فقرات نشرها لاعبين مثلكم</small></p>
        ${CLOUD()?`<div class="sorts" role="group" aria-label="الترتيب"><button type="button" data-sort="new" aria-pressed="${PUBSORT==="new"}">الأحدث</button><button type="button" data-sort="top" aria-pressed="${PUBSORT==="top"}">الأكثر لعباً</button></div>`:""}</div>

  app.querySelectorAll("[data-pub]").forEach(b=>b.onclick=()=>{const c=CUSTOM.find(x=>x.id===b.dataset.pub);if(c)showPublish(c)});
  app.querySelectorAll("[data-rep]").forEach(b=>b.onclick=()=>{const c=(PUBLIST||[]).find(x=>x.pid===b.dataset.rep);if(c)showReport(c)});

  const rt=document.getElementById("pubretry");if(rt)rt.onclick=()=>{PUBERR="";PUBLIST=null;render()};
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{S.catTab=b.dataset.tab;S.catScroll=0;render()});
  document.getElementById("back").onclick=()=>{S.screen="start";render()};
  document.getElementById("go").onclick=()=>{S.used={};S.scores=[0,0];S.turn=0;S.life=freshLife();S.swapUsed=[];sinceAd=0;buildPicks();trackGame();
    /* الفقرات العامة المختارة تنحفظ على الجهاز حتى تكمل اللعبة بدون نت، وينحسب لعبها */
    const keep={};S.cats.filter(id=>id.startsWith("p_")).forEach(id=>{const c=findCat(id);if(c){keep[id]=c;CLOUD()&&CLOUD().played(c.pid)}});PUB=keep;lsSet("lamma-pub",PUB);ensurePubMedia(Object.values(PUB));
    S.screen="board";render()};
}

function pubHTML(chip){
  if(!CLOUD())return `<p class="muted pubnote">قريباً: هنا تطلع فقرات نشرها لاعبين ثانيين، وتگدرون تنشرون فقراتكم للكل.</p>`;

  if(!PUBLIST)return `<p class="muted pubnote">جاري تحميل فقرات الجمهور…</p>`;
  const v=visiblePub();
  if(!v.length)return `<p class="muted pubnote">ما اكو فقرات منشورة بعد. سوّوا فقرة واضغطوا ⇪ حتى تكونون أول ناشرين!</p>`;

}

  const close=()=>d.remove();d.onclick=e=>{if(e.target===d)close()};d.querySelectorAll("[data-close]").forEach(b=>b.onclick=close);return {d,close,msg:t=>{const m=d.querySelector(".pmsg");if(m)m.textContent=t}}}

      <div class="row"><button class="btn btn-d" id="unpub" type="button">شيلها من الجمهور</button><button class="btn btn-p" id="repub" type="button">انشر النسخة الجديدة</button></div><p class="pmsg" role="status"></p>`);

    <div class="field"><label for="pauthor">اسمكم اللي يطلع ويا الفقرة</label><input id="pauthor" maxlength="24" value="${esc(ls("lamma-author",""))}" placeholder="مثلاً: شلة الكرادة"></div>
    <label class="terms"><input type="checkbox" id="pterms"> <span>أتعهد إن الفقرة ما بيها كلام مسيء أو بذيء أو صور وفيديوهات غير لائقة أو تخص أشخاص بدون إذنهم. وأفهم إن أي فقرة مخالفة تنحذف، والجهاز اللي نشرها ينحظر.</span></label>
    <div class="pbar" hidden><i></i></div><p class="pmsg" role="status"></p>

    if(!d.querySelector("#pterms").checked){msg("لازم توافقون على التعهد حتى تنشرون.");return}

      const items=await Promise.all(c.q.map(async x=>{const m=x[2];let blob=null;
        if(m&&m.mid&&MDB.urls[m.mid]){try{blob=await (await fetch(MDB.urls[m.mid])).blob()}catch(e){}}
        return {q:x[0],a:x[1],l:x[3]|0,blob}}));
      bar.hidden=false;
      const id=await C.publish({name:c.name,author,items},p=>{bar.firstChild.style.width=Math.round(p*100)+"%";msg("جاري رفع الصور والفيديوهات… "+Math.round(p*100)+"%")});
      const r=await Promise.resolve(id);c.pubId=r.id||r;saveCustom();PUBLIST=null;
      if(r.skipped){bar.hidden=true;msg(`انتشرت ✓ بس ${r.skipped} فيديو ما انرفع لأنه أكبر من 15 ميغا، وبقى عندكم بس.`);go.textContent="تمام";go.disabled=false;go.onclick=()=>{close();S.catTab="crowd";render()};return}
      close();S.catTab="crowd";render();

/* ---------- محرر فقرات الجمهور ---------- */
const PTS=[["200","t200"],["400","t400"],["600","t600"]];
const newItem=(l=0)=>({q:"",a:"",l,m:null});

/* استيراد فقرة من ملف: zip بيه index.txt (رقم | سؤال | جواب | نقاط) وصور مرقمة (meme-05.jpg)، أو txt وحده */
async function unzip(file){
  const buf=new Uint8Array(await file.arrayBuffer()),dv=new DataView(buf.buffer),out={};
  let e=-1;for(let i=buf.length-22;i>=Math.max(0,buf.length-70000);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}
  if(e<0)throw new Error("zip");
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const td=new TextDecoder();
  for(let k=0;k<n;k++){if(dv.getUint32(p,true)!==0x02014b50)break;
    const meth=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=td.decode(buf.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;
    if(name.endsWith("/")||/(^|\/)(__MACOSX|\._)/.test(name))continue;
    const ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),raw=buf.slice(ds,ds+cs);
    out[name.split("/").pop()]=meth===0?new Blob([raw]):meth===8?await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).blob():null}
  return out}
function parseIndex(txt){let name="";const rows=[];
  txt.replace(/^﻿/,"").split(/\r?\n/).forEach((ln,i)=>{ln=ln.trim();if(!ln)return;
    if(ln.startsWith("#")){name=name||ln.replace(/^#+\s*/,"");return}
    let p=ln.split("|").map(x=>x.trim());if(p.length<3)return;
    let id=null;if(/^\d+$/.test(p[0])&&p.length>=4){id=+p[0];p=p.slice(1)}
    const q=p[0].replace(/\s*\(صورة الجواب[^)]*\)/,""),a=p[1],pt=p[2]||"";
    const v=parseInt(pt,10),l=/صعب/.test(pt)?2:/متوسط/.test(pt)?1:/سهل/.test(pt)?0:isNaN(v)?0:v>=400?2:v>=300?1:0;
    if(q&&a)rows.push({id:id??rows.length+1,q,a,l})});
  return {name,rows}}
async function importFile(f){
  const sh=document.createElement("div");sh.className="sheet";sh.innerHTML=`<div class="card"><h3>جاري الاستيراد…</h3><p class="muted" id="impm">نقرأ الملف</p></div>`;document.body.appendChild(sh);
  const st=t=>{const m=sh.querySelector("#impm");if(m)m.textContent=t};
  const fail=t=>{sh.innerHTML=`<div class="card"><h3>ما گدرنا نستورد الملف</h3><p class="muted">${t}</p><div class="row"><button class="btn btn-p" type="button">تمام</button></div></div>`;sh.querySelector("button").onclick=()=>sh.remove()};
  try{
    let files={},txt="";
    if(/\.zip$/i.test(f.name)||f.type.includes("zip")){
      if(typeof DecompressionStream==="undefined")return fail("المتصفح قديم. حدّثوه أو جربوا من كروم.");
      files=await unzip(f);const k=Object.keys(files).find(x=>/\.(txt|csv)$/i.test(x));
      if(!k)return fail("ما لگينا ملف index.txt داخل الـzip.");txt=await files[k].text()}
    else txt=await f.text();
    const {name,rows}=parseIndex(txt);
    if(!rows.length)return fail("الملف ما بيه أسئلة. كل سطر لازم يكون: رقم | السؤال | الجواب | النقاط");
    const imgs={};Object.keys(files).forEach(k=>{const m=k.match(/(\d+)\.(jpe?g|png|webp|gif)$/i);if(m&&files[k])imgs[+m[1]]=files[k]});
    const items=[];let done=0;const tot=rows.filter(r=>imgs[r.id]).length;
    for(const r of rows){let m=null;const b=imgs[r.id];
      if(b&&MDB.db){st(`نحفظ الصور ${++done} من ${tot}`);
        const blob=await shrinkImage(new File([b],"i.jpg",{type:"image/jpeg"})),mid="m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
        if(await MDB.put(mid,blob))m={mid,type:"image"}}
      items.push({q:r.q,a:r.a,l:r.l,m})}
    sh.remove();
    S.draft={id:null,name:(name||(/[؀-ۿ]/.test(f.name)?f.name.replace(/\.[^.]+$/,""):"")).slice(0,24),items};
    S.catTab="crowd";S.screen="editor";render();
    const em=document.getElementById("emsg");if(em)em.textContent=`انضافت ${items.length} أسئلة${tot?` و${tot} صورة`:""}. راجعوها واضغطوا «حفظ الفقرة».`;
    if(!S.draft.name){const en=document.getElementById("ename");if(en)en.focus()}
  }catch(e){fail("الملف تالف أو مو zip صحيح.")}
}
function openEditor(c){
  S.draft={id:c?c.id:null,name:c?c.name:"",items:c?c.q.map(x=>({q:x[0],a:x[1],l:x[3]||0,m:x[2]&&x[2].mid?x[2]:null})):[newItem(0)]};
  S.catTab="crowd";S.screen="editor";render();
}
function draftStats(d){const n=[0,0,0];d.items.forEach(it=>n[it.l]++);return {n,rounds:Math.min(...n.map(x=>Math.floor(x/2)))}}
function shrinkImage(file){return new Promise(res=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const m=1600,k=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b||file),"image/jpeg",.85)};
  img.onerror=()=>{URL.revokeObjectURL(u);res(file)};img.src=u})}
function Editor(){
  const d=S.draft;if(!d){S.screen="cats";render();return}
  const st=draftStats(d);
  const card=(it,i)=>{const mu=it.m&&MDB.urls[it.m.mid];
    return `<section class="qcard" data-i="${i}">
      <div class="qc-head"><span class="qc-num">سؤال ${i+1}</span>
        <div class="qc-pts" role="group" aria-label="نقاط السؤال">${PTS.map(([p,cls],l)=>`<button type="button" class="ptbtn ${cls} ${it.l===l?"on":""}" data-pt="${l}" aria-pressed="${it.l===l}">${p}</button>`).join("")}</div>
        <button type="button" class="qc-del" data-del="${i}" aria-label="حذف السؤال ${i+1}">حذف</button></div>

  });
  document.getElementById("eadd").onclick=()=>{sync();const last=d.items[d.items.length-1];d.items.push(newItem(last?last.l:0));render();
    const e=app.querySelector(".editor");if(e)e.scrollTop=e.scrollHeight;const q=document.getElementById("q"+(d.items.length-1));if(q)q.focus()};

  document.getElementById("esave").onclick=()=>{
    clearTimeout(Editor.t);sync();let bad=0;const msg=document.getElementById("emsg");

    app.querySelectorAll(".qc-text input").forEach(inp=>{if(!inp.value.trim()){inp.classList.add("bad");bad++}});
    if(bad){msg.textContent="باقي "+bad+" خانات فارغة، معلّمة بالأحمر.";(app.querySelector(".bad")||nm).focus();return}

  };

      if(!u)return `<button class="tile t${v}" data-k="${k}" aria-label="${esc(c.name)} ${v}">${v}</button>`;
      const mark=["a","b","ab"].includes(u)?`<span class="marks">${u.split("").map(x=>`<span class="dot ${x}"></span>`).join("")}</span>`:"—";
      return `<button class="tile used" disabled aria-label="${esc(c.name)} ${v} مستخدم">${mark}</button>`}).join("")}</div>`}).join("")}</div>${teamPanel(1,t)}</div>`;

/* ---------- 4. السؤال ---------- */
/* صور الخرائط والأعلام بنسخة الويب: ملف منفصل ينزل بس إذا اخترتوا الفقرة (حتى الصفحة تفتح أسرع) */
const LZ={},LZGET={};
function lzFill(id,html){document.querySelectorAll(`[data-lz^="${id}:"]`).forEach(e=>{const n=+e.dataset.lz.split(":")[1];e.removeAttribute("data-lz");e.innerHTML=html?html(n):`<p class="muted">ما گدرنا نحمّل الصورة. تأكدوا من الإنترنت.</p>`})}
function lzLoad(id){if(LZ[id])return Promise.resolve(true);
  return LZGET[id]||(LZGET[id]=(async()=>{for(let t=0;t<3;t++){try{const r=await fetch("/m-"+id+".json?v="+(window.LAMMA_LZV||""));if(r.ok){const a=await r.json();LZ[id]=a;lzFill(id,n=>a[n]||"");return true}}catch(e){}await new Promise(r=>setTimeout(r,800))}
    lzFill(id,null);delete LZGET[id];return false})())}
function lzPrefetch(ids){ids.forEach(id=>{const c=findCat(id);const m=c&&c.q[0]&&c.q[0][2];if(m&&m.lz)lzLoad(m.lz)})}
function mediaHTML(m){
  if(!m)return "";
  if(m.lz){const a=LZ[m.lz];if(a)return `<div class="media">${a[m.n]||""}</div>`;lzLoad(m.lz);return `<div class="media" data-lz="${m.lz}:${m.n}"><p class="muted">جاري تحميل الصورة…</p></div>`}
  if(m.svg)return `<div class="media">${m.svg}</div>`;
  if(m.img)return `<div class="media"><img src="${esc(m.img)}" alt=""></div>`;
  if(m.video)return `<div class="media"><video src="${esc(m.video)}" controls playsinline></video></div>`;
  if(m.mid){const u=MDB.urls[m.mid];
    if(!u){if(m.r&&CLOUD()){fetchPub(m);return `<div class="media" data-wait="${m.mid}"><p class="muted">جاري تحميل الصورة…</p></div>`}
      return `<div class="media"><p class="muted">${MDB.db?"الملف غير موجود على هذا الجهاز":"جاري تحميل الملف…"}</p></div>`}
    return m.type==="video"?`<div class="media"><video src="${u}" controls playsinline preload="metadata"></video></div>`:`<div class="media"><img src="${u}" alt=""></div>`}
  return "";
}
function firstLetter(ans){
  let w=String(ans).replace(/^[^\p{L}\p{N}]+/u,"").split(/\s+/)[0]||"";
  w=w.replace(/[\u064B-\u0652\u0640]/g,"");
  if(/^(ال|لل)/.test(w)&&w.length>3)w=w.slice(2);
  /* إذا بعد «ال» ألف أو همزة (الأردن، الإمارات) نكشف حرفين حتى يفيد التلميح */
  return /^[اأإآ]/.test(w)&&w.length>2?w.slice(0,2):w.charAt(0);
}
/* ---------- تنويع الأسئلة: سؤالان من كل مستوى، مع تذكّر ما ظهر سابقاً ---------- */
let SEEN={};try{SEEN=JSON.parse(localStorage.getItem("lamma-seen"))||{}}catch(e){}
function saveSeen(){try{localStorage.setItem("lamma-seen",JSON.stringify(SEEN))}catch(e){}}
function markSeen(id,i){const a=SEEN[id]||(SEEN[id]=[]);if(!a.includes(i)){a.push(i);saveSeen()}}
function levelIdx(c,l){if(c.custom||c.lv)return c.q.map((x,i)=>x[3]===l?i:-1).filter(i=>i>=0);const n=c.q.length/3;return Array.from({length:n},(_,k)=>l*n+k)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function freshFirst(c,list){const seen=new Set(SEEN[c.id]||[]);const fresh=list.filter(i=>!seen.has(i));return shuffle(fresh).concat(shuffle(list.filter(i=>seen.has(i))))}
function pickLevel(c,l){
  const all=levelIdx(c,l),seen=new Set(SEEN[c.id]||[]);
  if(all.filter(i=>!seen.has(i)).length<2){SEEN[c.id]=(SEEN[c.id]||[]).filter(i=>!all.includes(i));saveSeen()}
  return freshFirst(c,all).slice(0,2);
}
function buildPicks(){S.pick={};S.cats.forEach(id=>{const c=findCat(id);S.pick[id]=[0,1,2].flatMap(l=>pickLevel(c,l))})}
function tileSrc(id,i){return (S.pick&&S.pick[id])?S.pick[id][i]:i}
function pickSwap(q){
  const c=findCat(q.id),l=Math.floor(q.i/2);
  const taken=new Set((S.pick&&S.pick[q.id])||[]);S.swapUsed.forEach(k=>{const[a,b]=k.split(":");if(a===q.id)taken.add(+b)});
  const same=freshFirst(c,levelIdx(c,l).filter(i=>!taken.has(i)));
  return same.length?{id:q.id,i:same[0]}:null;
}
function hexOf(str){return Array.from(new TextEncoder().encode(str)).map(b=>b.toString(16).padStart(2,"0")).join("")}
function wordQR(word){
  try{const url=WORD_URL?WORD_URL+"#w"+hexOf(word):"https://www.google.com/search?q="+encodeURIComponent(word);const qr=qrcode(0,"M");qr.addData(url);qr.make();
    return qr.createSvgTag({cellSize:4,margin:3,scalable:true}).replace("<svg ",'<svg class="qr" ')}catch(e){return ""}
}

function Question(){
  const q=S.q;q.src=q.src||{id:q.id,i:tileSrc(q.id,q.i)};q.letter=q.letter||[0,0];q.double=q.double||[0,0];
  markSeen(q.src.id,q.src.i);
  const c=findCat(q.src.id),v=VALUES[q.i],entry=c.q[q.src.i],charades=c.kind==="charades";
  const text=charades?"":entry[0],ans=charades?entry[0]:entry[1],media=charades?null:entry[2];
  const first=S.turn,second=1-S.turn,cls=["a","b"];
  const pillCls="t"+v,swapped=q.src.i!==tileSrc(q.id,q.i);
  if(q.phase===2&&!q.peek){Reveal(q,c,v,ans,first,second,pillCls,swapped);return}
  let rail="";
  if(q.phase<2){
    const team=q.phase===0?first:second,total=q.phase===0?S.timeA:S.timeB,C=2*Math.PI*64,L=S.life[team];
    const canSwap=L.swap&&q.phase===0&&!swapped&&!!pickSwap(q);
    rail=`<div class="phase"><span class="dot ${cls[team]}"></span>${q.phase===0?"دور":"الآن"} ${esc(S.teams[team])}${q.double[team]?' <span class="tag2">جوابين</span>':""}</div>
      <div class="trow"><div class="ring ${cls[team]} ${q.paused?"is-paused":""}" id="ring" role="button" tabindex="0" aria-label="إيقاف أو تشغيل الوقت"><svg viewBox="0 0 150 150"><circle class="track" cx="75" cy="75" r="64"/>
        <circle class="prog" id="prog" cx="75" cy="75" r="64" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-q.left/total)).toFixed(1)}"/></svg>
        <div class="num" id="num">${q.left}</div></div>
      <div class="tctl">
        <button class="tbtn" id="pause" type="button">${q.paused?"▶ كمّل":"❚❚ إيقاف"}</button>
        <button class="tbtn" id="reset" type="button">↻ إعادة</button>
      </div></div>
      <div class="lifes">
        <button class="life ${q.letter[team]?"on":""}" data-l="letter" ${L.letter?"":"disabled"} title="يكشف أول حرف من الإجابة"><b>أ</b>أول حرف</button>
        <button class="life" data-l="swap" ${canSwap?"":"disabled"} title="${q.phase===1?"تغيير السؤال للفريق صاحب الدور فقط":"سؤال بديل بنفس النقاط"}"><b>⇄</b>${charades?"غيّر الكلمة":"غيّر السؤال"}</button>
        <button class="life ${q.double[team]?"on":""}" data-l="double" ${L.double?"":"disabled"} title="يكتب الفريق إجابتين"><b>٢</b>جوابين</button>
      </div>
      <button class="btn ${q.phase===0?"btn-p":"btn-s"} btn-wide" id="done">${q.phase===0?"جاوبنا، دور الفريق الثاني":"جاوبنا، اكشف الإجابة"}</button>`;
  }else{
    rail=`<p class="phase">هذا السؤال، وبعدها ارجعوا للإجابة</p>
      <button class="btn btn-p btn-wide" id="toAns">ارجع للإجابة</button>`;
  }
  const hints=[0,1].filter(t=>q.letter[t]).map(t=>`<span class="hintchip ${cls[t]}">أول حرف لـ${esc(S.teams[t])}: <b>${esc(firstLetter(ans))}</b></span>`).join("");
  const activeTeam=q.phase===0?first:q.phase===1?second:-1;
  app.innerHTML=`${topBar(teamChips(activeTeam),`<button class="link" id="back" type="button">رجوع للوحة</button>`)}
  <div class="qstage">
    <div class="qmain">
      <div class="qmeta"><span class="qcat">${swapped?(charades?"كلمة بديلة · ":"سؤال بديل · "):""}${esc(c.name)}</span><span class="pill ${pillCls}">${v}</span></div>
      ${charades?`<div class="media qrbox">${wordQR(ans)}</div><p class="qtext"><span class="fitin">${esc(S.teams[q.phase===1?second:first])}: امسحوا الباركود ومثّلوا بدون كلام <span class="kindtag">${esc(entry[1])}</span></span></p>`
        :media?mediaHTML(media)+`<p class="qtext"><span class="fitin">${esc(text)}</span></p>`:`<p class="qtext solo"><span class="fitin">${esc(text)}</span></p>`}
      ${hints?`<div class="hints">${hints}</div>`:""}
    </div>
    <div class="rail">${rail}</div>
  </div>`;
  wireBar();
  document.getElementById("back").onclick=()=>{S.q=null;S.screen="board";render()};
  if(q.phase<2){
    const team=q.phase===0?first:second,total=q.phase===0?S.timeA:S.timeB,C=2*Math.PI*64;
    const next=()=>{beep(440,.25,.1);q.phase++;q.left=S.timeB;q.paused=false;render()};
    document.getElementById("done").onclick=next;
    const togglePause=()=>{q.paused=!q.paused;beep(q.paused?520:700,.08,.07);render()};
    document.getElementById("pause").onclick=togglePause;
    document.getElementById("ring").onclick=togglePause;
    document.getElementById("reset").onclick=()=>{q.left=total;q.paused=false;beep(700,.08,.07);render()};
    app.querySelectorAll(".life").forEach(b=>b.onclick=()=>{
      const k=b.dataset.l,L=S.life[team];if(!L[k])return;
      if(k==="letter"){L.letter=0;q.letter[team]=1}
      if(k==="double"){L.double=0;q.double[team]=1}
      if(k==="swap"){const p=pickSwap(q);if(!p)return;L.swap=0;S.swapUsed.push(p.id+":"+p.i);q.src=p;markSeen(p.id,p.i);q.left=S.timeA;q.paused=false;q.letter=[0,0]}
      beep(760,.12,.08);render();
    });
    tick=setInterval(()=>{if(q.paused)return;q.left--;
      const num=document.getElementById("num"),prog=document.getElementById("prog"),ring=document.getElementById("ring");
      if(!num){clearInterval(tick);return}
      const l=Math.max(q.left,0);num.textContent=l;prog.style.strokeDashoffset=(C*(1-l/total)).toFixed(1);
      if(q.left<=5&&q.left>0){ring.classList.add("late");beep(1000,.05)}
      if(q.left<=0){clearInterval(tick);next()}
      save();
    },1000);
  }else{
    document.getElementById("toAns").onclick=()=>{q.peek=false;render()};
  }
}

function Reveal(q,c,v,ans,first,second,pillCls,swapped){
  const cls=["a","b"],picked=q.right[0]||q.right[1]||q.nobody;
  app.innerHTML=`${topBar(teamChips(-1),`<button class="link" id="back" type="button">رجوع للوحة</button>`)}
  <div class="reveal">
    <button class="side" id="peek" type="button"><span class="arrow" aria-hidden="true">→</span>ارجع للسؤال</button>
    <div class="ansbox">
      <div class="qmeta"><span class="qcat">${swapped?"سؤال بديل · ":""}${esc(c.name)}</span><span class="pill ${pillCls}">${v}</span></div>
      <div class="ans-main"><span class="ans-lbl">${c.kind==="charades"?"الكلمة":"الإجابة"}</span><span class="ans-val"><span class="fitin">${esc(ans)}</span></span></div>
      <div class="who">
        <p class="who-q">منو جاوب؟</p>
        <div class="who-row">
          ${[first,second].map(t=>`<button class="wbtn ${cls[t]}" data-t="${t}" aria-pressed="${!!q.right[t]}"><span>${esc(S.teams[t])}</span>${q.double[t]?'<small>جوابين: يكفي واحد صح</small>':""}</button>`).join("")}
          <button class="wbtn none" id="nobody" aria-pressed="${!!q.nobody}"><span>محد دبرها</span></button>
        </div>
      </div>
    </div>
    <button class="side next" id="next" type="button" ${picked?"":"disabled"}><span class="arrow" aria-hidden="true">←</span>التالي${picked&&!q.nobody?`<small>+${v} ${q.right[0]&&q.right[1]?"للفريقين":"نقطة"}</small>`:picked?"<small>بدون نقاط</small>":"<small>اختاروا منو جاوب</small>"}</button>
  </div>`;
  wireBar();
  document.getElementById("back").onclick=()=>{S.q=null;S.screen="board";render()};
  document.getElementById("peek").onclick=()=>{q.peek=true;render()};
  app.querySelectorAll(".wbtn[data-t]").forEach(b=>b.onclick=()=>{const t=+b.dataset.t;q.right[t]=!q.right[t];if(q.right[t])q.nobody=false;render()});
  document.getElementById("nobody").onclick=()=>{q.nobody=!q.nobody;if(q.nobody)q.right=[false,false];render()};
  document.getElementById("next").onclick=()=>{
    if(!(q.right[0]||q.right[1]||q.nobody))return;
    if(q.right[0])S.scores[0]+=v; if(q.right[1])S.scores[1]+=v;
    bumpTeam=q.right[0]&&q.right[1]?2:q.right[0]?0:q.right[1]?1:-1;
    if(bumpTeam>=0)beep(1200,.15,.08);
    S.used[q.id+":"+q.i]=bumpTeam===2?"ab":bumpTeam===0?"a":bumpTeam===1?"b":"x";
    S.turn=1-S.turn;S.q=null;
    S.screen=usedCount()>=totalTiles()?"end":"board";
    sinceAd++;
    if(NATIVE&&!PREMIUM&&sinceAd>=AD_EVERY&&S.screen==="board"){sinceAd=0;render();showInterstitial(()=>{})}
    else if(!NATIVE&&window.adBreak&&sinceAd>=AD_EVERY&&S.screen==="board"){sinceAd=0;render();webAdBreak()}else render();
  };
}

/* ---------- 5. النهاية ---------- */
function End(){
  const [a,b]=S.scores,w=a===b?-1:a>b?0:1;
  app.innerHTML=`${topBar()}
  <div class="win">${w<0?`<p class="crown">انتهت اللعبة</p><h2>تعادل!</h2>`:
    `<p class="crown">الفائز</p><h2 class="${w?"b":"a"}">${esc(S.teams[w])}</h2>`}
    <div class="finals">${teamCard(0,-1)}${teamCard(1,-1)}</div>
    <div class="row" style="width:min(560px,100%)"><button class="btn btn-p" id="again">جولة جديدة</button><button class="btn btn-g" id="home">البداية</button></div>
  </div>`;
  wireBar();
  if(w>=0)[523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,.2,.08),i*160));
  document.getElementById("again").onclick=()=>{S.cats=[];S.used={};S.scores=[0,0];S.turn=0;S.life=freshLife();S.swapUsed=[];S.screen="cats";render()};
  document.getElementById("home").onclick=()=>{const t=S.teams;S=fresh();S.teams=t;render()};
}

(function(){
  const sp=document.getElementById("splash");if(!sp)return;
  const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  let gone=false;const end=()=>{if(gone)return;gone=true;sp.classList.add("out");setTimeout(()=>sp.remove(),600)};
  sp.onclick=end;sp.onkeydown=e=>{if(e.key==="Enter"||e.key===" ")end()};
  setTimeout(end,reduce?1200:5200);
})();
safeRender();
addEventListener("load",()=>{setTimeout(()=>{try{const C=CLOUD();C&&C.visit&&C.visit()}catch(e){}},1500)});
if(NATIVE){window.LammaNative.ready.then(async()=>{
  try{const p=await window.LammaNative.isPremium();if(p!==null&&p!==PREMIUM){setPremium(p);if(!p)render()}
  const pr=await window.LammaNative.getPrice();if(pr)showPremium.price=pr;}catch(e){}
})}
try{const d=window.claude?.hot?.data;if(d&&d.screen){S=d;safeRender()}}catch(e){}
